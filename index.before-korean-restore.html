<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAN-SERVIVE</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#151821;color:#f4f7fb;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;overflow:hidden}
    .app{position:relative;width:100vw;height:100vh;background:#1c2029}
    canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
    .hud{position:absolute;inset:14px 16px auto;display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start;pointer-events:none}
    .panel{background:rgba(20,24,32,.78);border:1px solid rgba(218,228,240,.18);border-radius:8px;box-shadow:0 14px 36px rgba(0,0,0,.28);backdrop-filter:blur(8px)}
    .status{padding:10px;min-width:250px}
    .bar{height:10px;background:#2b313f;border-radius:4px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
    .bar+.bar{margin-top:7px}
    .fill{height:100%;width:100%;background:#e34b5d}
    .xp .fill{background:#56c7ee}
    .sp .fill{background:#9b7cff}
    .meta{display:flex;justify-content:space-between;margin-top:8px;color:#cbd4df;font-size:12px}
    .timer{padding:10px 18px;text-align:center}
    .timer strong{display:block;font-size:24px;letter-spacing:0}
    .timer span{font-size:12px;color:#aeb8c7}
    .skills{justify-self:end;display:flex;gap:8px;align-items:flex-start;max-width:48vw;flex-wrap:wrap;justify-content:flex-end}
    .slot{width:70px;min-height:70px;padding:7px;background:rgba(20,24,32,.78);border:1px solid rgba(218,228,240,.18);border-radius:8px;text-align:center}
    .slot b{display:block;font-size:20px;line-height:1}
    .slot span{display:block;margin-top:5px;color:#d7e3ef;font-size:11px;line-height:1.25;word-break:keep-all}
    .slot small{display:block;margin-top:4px;color:#56c7ee;font-size:10px}
    .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 38%,rgba(71,91,116,.34),rgba(13,16,22,.9) 58%),rgba(13,16,22,.88);padding:22px}
    .card{width:min(780px,100%);background:#f7f9fc;color:#1d2633;border:1px solid #d7e1ec;border-radius:8px;box-shadow:0 24px 70px rgba(0,0,0,.38);padding:24px}
    .start-card{width:min(1080px,100%);padding:20px;background:#1b2532;color:#edf6ff;border:4px solid #090c10;box-shadow:0 24px 70px rgba(0,0,0,.48),inset 0 0 0 4px #33465e}
    h1,h2,p{margin:0} h1{font-size:32px;letter-spacing:0;text-shadow:0 3px 0 #090c10} h2{font-size:22px;margin-bottom:14px}
    .select-title{color:#fff6d0;text-align:center;font:900 clamp(38px,6vw,64px) "Courier New","Lucida Console",monospace;letter-spacing:1px;-webkit-text-stroke:3px #090c10;text-shadow:0 5px 0 #24637b,0 9px 0 #090c10,0 0 18px rgba(86,199,238,.65)}
    .lead{margin-top:10px;color:#bfd0df;line-height:1.6}
    .build{display:grid;grid-template-columns:120px 1fr;gap:18px;margin-top:20px;align-items:center}
    .portrait{height:120px;border:1px solid #d7e1ec;border-radius:8px;background:#e9eef5;display:grid;place-items:center;overflow:hidden}
    .pixel-man{width:84px;height:84px;image-rendering:pixelated;background:url("assets/geontaek_run4_office.png") left top/400% 400% no-repeat}
    .traits{display:grid;gap:8px;color:#405064;line-height:1.45}
    .character-select{margin-top:18px;display:grid;gap:12px;padding:12px;border:3px solid #090c10;background:linear-gradient(#223248,#151d29);box-shadow:inset 0 0 0 3px rgba(255,255,255,.05)}
    .carousel{position:relative;height:474px;overflow:hidden;perspective:900px}
    .carousel::before{content:"";position:absolute;left:50%;bottom:7px;width:min(88%,800px);height:84px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at center,rgba(82,206,238,.23),rgba(82,206,238,.08) 36%,rgba(25,31,39,0) 72%)}
    .select-card{position:absolute;left:50%;top:24px;width:292px;padding:12px;background:#f8f0cf;border:4px solid #0f1319;border-radius:8px;box-shadow:0 11px 0 #a5772b,0 24px 42px rgba(0,0,0,.36),inset 0 0 0 4px #fff6d0;display:grid;grid-template-rows:274px auto;gap:8px;transition:transform .48s cubic-bezier(.17,1.35,.28,1),filter .36s ease,opacity .36s ease,box-shadow .36s ease;transform:translateX(-50%) translateY(100px) scale(.58) rotateZ(0deg);opacity:0;filter:grayscale(1) contrast(.68) blur(7px);pointer-events:none;transform-origin:50% 120%}
    .select-card.is-center,.select-card.is-left-1,.select-card.is-right-1,.select-card.is-left-2,.select-card.is-right-2{pointer-events:auto}
    .select-card.is-center{z-index:5;opacity:1;filter:none;box-shadow:0 14px 0 #a5772b,0 30px 54px rgba(0,0,0,.42),0 0 0 5px rgba(86,199,238,.18),inset 0 0 0 4px #fff6d0;transform:translateX(-50%) translateY(0) scale(1) rotateZ(0deg)}
    .select-card.is-left-1{z-index:4;opacity:.58;filter:grayscale(1) contrast(.68) blur(4px);transform:translateX(calc(-50% - 260px)) translateY(48px) rotateZ(-10deg) rotateY(22deg) scale(.76)}
    .select-card.is-right-1{z-index:4;opacity:.58;filter:grayscale(1) contrast(.68) blur(4px);transform:translateX(calc(-50% + 260px)) translateY(48px) rotateZ(10deg) rotateY(-22deg) scale(.76)}
    .select-card.is-left-2{z-index:3;opacity:.22;filter:grayscale(1) contrast(.56) blur(8px);transform:translateX(calc(-50% - 440px)) translateY(112px) rotateZ(-18deg) rotateY(34deg) scale(.54)}
    .select-card.is-right-2{z-index:3;opacity:.22;filter:grayscale(1) contrast(.56) blur(8px);transform:translateX(calc(-50% + 440px)) translateY(112px) rotateZ(18deg) rotateY(-34deg) scale(.54)}
    .carousel.is-moving .select-card.is-center{animation:selectThump .42s cubic-bezier(.18,1.45,.32,1)}
    .carousel.is-moving .select-card.is-left-1,.carousel.is-moving .select-card.is-right-1{animation:sideSwoop .42s cubic-bezier(.18,1.25,.32,1)}
    @keyframes selectThump{0%{filter:brightness(1.16);transform:translateX(-50%) translateY(-18px) scale(1.08) rotateZ(var(--kick,0deg))}60%{transform:translateX(-50%) translateY(4px) scale(.98) rotateZ(0deg)}100%{filter:none;transform:translateX(-50%) translateY(0) scale(1) rotateZ(0deg)}}
    @keyframes sideSwoop{0%{filter:grayscale(1) contrast(.72) brightness(1.04) blur(2px)}50%{filter:grayscale(.9) contrast(.76) brightness(1.02) blur(3px)}100%{filter:grayscale(1) contrast(.68) blur(4px)}}
    .select-card canvas{width:100%;height:274px;border:4px solid #111318;background:#dbeef2;image-rendering:auto}
    .select-info{border:3px solid #111318;background:#fffef3;color:#16191f;font-size:15px;line-height:1.35}
    .select-info div{display:grid;grid-template-columns:58px 1fr;min-height:35px;border-bottom:2px solid #111318}
    .select-info div:last-child{border-bottom:0}
    .select-info b{padding:7px;background:#f5ca55;border-right:2px solid #111318}
    .select-info span{padding:7px;word-break:keep-all}
    .carousel-btn{position:absolute;top:50%;z-index:8;width:48px;height:64px;padding:0;border:4px solid #090c10;border-radius:8px;background:#56c7ee;color:#090c10;font:900 30px "Courier New",monospace;box-shadow:0 7px 0 #24637b}
    .carousel-btn:hover{background:#8ce8ff}
    .carousel-btn.prev{left:16px}.carousel-btn.next{right:16px}
    .select-hint{justify-self:center;padding:7px 16px;border:2px solid rgba(86,199,238,.65);background:rgba(9,12,16,.58);color:#fff6d0;font:900 15px "Courier New","Lucida Console",monospace;text-align:center;text-shadow:0 2px 0 #090c10;box-shadow:0 0 16px rgba(86,199,238,.22)}
    button{border:0;border-radius:8px;background:#1b2636;color:white;padding:12px 18px;font:inherit;cursor:pointer}
    button:hover{background:#26364b}
    .start-row{display:flex;align-items:center;justify-content:center;margin-top:18px}
    .press-space{display:flex;align-items:center;justify-content:center;gap:14px;color:#fff6d0;font:900 clamp(22px,3vw,34px) "Courier New","Lucida Console",monospace;letter-spacing:3px;text-shadow:0 3px 0 #090c10,0 0 16px rgba(86,199,238,.7);animation:pressBlink .9s steps(2,end) infinite}
    .space-key{position:relative;display:inline-block;width:clamp(92px,14vw,150px);height:.78em;border:3px solid #090c10;border-radius:7px;background:linear-gradient(#fff8dc,#d9ca91);box-shadow:inset 0 -5px 0 #a5772b,inset 0 3px 0 rgba(255,255,255,.6),0 4px 0 #090c10,0 0 14px rgba(86,199,238,.35);vertical-align:middle}
    .space-key::before{content:"";position:absolute;left:16%;right:16%;bottom:.2em;height:2px;border-radius:999px;background:rgba(9,12,16,.34);box-shadow:0 1px 0 rgba(255,255,255,.48)}
    .space-key::after{content:"";position:absolute;left:19%;right:19%;bottom:.28em;height:1px;border-radius:999px;background:rgba(255,255,255,.42)}
    .end-retry{display:inline-block;padding:12px 22px;border-radius:8px;background:#1b2636;color:#fff;font:inherit;cursor:pointer}
    .end-retry:hover{background:#26364b}
    @keyframes pressBlink{0%,55%{opacity:1;transform:scale(1)}56%,100%{opacity:.22;transform:scale(.985)}}
    .choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .choice{background:#fff;border:1px solid #d5dfeb;border-radius:8px;padding:14px;text-align:left;cursor:pointer;color:#1d2633}
    .choice:hover{border-color:#2d8fb8;box-shadow:0 10px 22px rgba(45,143,184,.14)}
    .choice.selected{border-color:#2d8fb8;box-shadow:0 0 0 3px rgba(45,143,184,.18),0 10px 22px rgba(45,143,184,.14)}
    .choice b{display:block;font-size:22px}.choice strong{display:block;margin-top:8px}.choice p{margin-top:8px;color:#536274;font-size:13px;line-height:1.45}
    .hidden{display:none}
    .toast{position:absolute;left:50%;top:92px;transform:translateX(-50%);padding:9px 14px;color:#f5fbff;background:rgba(20,24,32,.86);border:1px solid rgba(218,228,240,.18);border-radius:8px;opacity:0;transition:.2s;pointer-events:none}
    .toast.on{opacity:1}
    .pause-card{width:min(420px,calc(100vw - 32px));background:#172230;color:#edf6ff;border:4px solid #090c10;box-shadow:0 22px 60px rgba(0,0,0,.5),inset 0 0 0 3px rgba(255,255,255,.06)}
    .pause-card h2{margin:0 0 16px;text-align:center;font:900 30px "Courier New","Lucida Console",monospace;color:#fff6d0;text-shadow:0 3px 0 #090c10}
    .pause-menu{display:grid;gap:10px}
    .pause-menu button{width:100%;border:2px solid rgba(218,228,240,.22);background:#243448;text-align:left;font-weight:800}
    .pause-menu button:hover{background:#31506a}
    .test-tools{position:absolute;right:14px;bottom:14px;display:flex;gap:8px;z-index:3;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 28px)}
    .test-tools button{padding:9px 12px;background:rgba(27,38,54,.82);border:1px solid rgba(218,228,240,.22);font-size:12px;box-shadow:0 8px 22px rgba(0,0,0,.18)}
    .test-tools button:hover{background:#26364b}
    .test-tools button.on{background:#56c7ee;color:#091018;border-color:#9ee8ff}
    .test-tools .test-only{display:none}
    .test-tools.on .test-only{display:inline-block}
    .test-tools button:disabled{opacity:.45;cursor:default}
    @media (max-width:760px){
      .hud{grid-template-columns:1fr auto;inset:10px}.skills{grid-column:1/3;justify-self:start;max-width:100%}.slot{width:58px;min-height:58px}.timer strong{font-size:19px}.build{grid-template-columns:1fr}.choices{grid-template-columns:1fr}
      .overlay{padding:10px}.start-card{padding:14px}.select-title{font-size:36px;-webkit-text-stroke:2px #090c10}.carousel{height:406px}.select-card{top:18px;width:244px;grid-template-rows:218px auto}.select-card canvas{height:218px}.select-card.is-left-1{transform:translateX(calc(-50% - 178px)) translateY(54px) rotateZ(-10deg) rotateY(18deg) scale(.64)}.select-card.is-right-1{transform:translateX(calc(-50% + 178px)) translateY(54px) rotateZ(10deg) rotateY(-18deg) scale(.64)}.select-card.is-left-2,.select-card.is-right-2{opacity:0}.carousel-btn{width:40px;height:54px}.carousel-btn.prev{left:2px}.carousel-btn.next{right:2px}.select-info{font-size:12px}.start-row{margin-top:12px}
    }
  </style>
</head>
<body>
  <div class="app">
    <canvas id="game"></canvas>
    <div class="hud">
      <div class="status panel">
        <div class="bar"><div id="hpFill" class="fill"></div></div>
        <div class="bar sp"><div id="spFill" class="fill"></div></div>
        <div class="bar xp"><div id="xpFill" class="fill"></div></div>
        <div class="meta"><span id="levelText">Lv. 1 분석가</span><span id="killText">처리 0</span></div>
      </div>
      <div class="timer panel"><strong id="timeText">00:00</strong><span>끝까지 생존</span></div>
      <div id="skillHud" class="skills"></div>
    </div>
    <div id="toast" class="toast"></div>
    <div class="test-tools">
      <button id="testModeBtn" type="button">테스트 OFF</button>
      <button id="clearTestBtn" type="button">클리어 테스트</button>
      <button id="waveTestBtn" class="test-only" type="button">1 WAVE</button>
      <button id="bossTestBtn" class="test-only" type="button">1 BOSS</button>
      <button id="stage2TestBtn" class="test-only" type="button">2 STAGE</button>
      <button id="wave2TestBtn" class="test-only" type="button">2 WAVE</button>
      <button id="boss2TestBtn" class="test-only" type="button">2 BOSS</button>
      <button id="stage3TestBtn" class="test-only" type="button">3 STAGE</button>
      <button id="wave3TestBtn" class="test-only" type="button">3 WAVE</button>
      <button id="boss3TestBtn" class="test-only" type="button">3 BOSS</button>
      <button id="ultimateBtn" type="button">필살기</button>
    </div>

    <div id="startOverlay" class="overlay">
      <div class="card start-card">
        <h1 class="select-title">SELECT PLAYER</h1>
        <div class="character-select">
          <div class="carousel" id="characterCarousel">
            <button class="carousel-btn prev" id="characterPrev" type="button" aria-label="이전 캐릭터">&lt;</button>
            <div id="characterCards"></div>
            <button class="carousel-btn next" id="characterNext" type="button" aria-label="다음 캐릭터">&gt;</button>
          </div>
          <span class="select-hint">A/D 또는 방향키로 선택</span>
        </div>
        <div class="start-row">
          <div id="startBtn" class="press-space" role="button" tabindex="0"><span>PRESS</span><span class="space-key" aria-label="spacebar"></span><span>TO START</span></div>
        </div>
      </div>
    </div>

    <div id="levelOverlay" class="overlay hidden">
      <div class="card">
        <h2>레벨업! 다음 계획을 선택</h2>
        <div id="choices" class="choices"></div>
      </div>
    </div>
    <div id="pauseOverlay" class="overlay hidden">
      <div class="card pause-card">
        <h2>PAUSED</h2>
        <div class="pause-menu">
          <button id="resumeBtn" type="button">계속하기</button>
          <button id="homeBtn" type="button">처음으로</button>
          <button id="soundToggleBtn" type="button">소리 ON</button>
          <button id="pauseTestModeBtn" type="button">테스트모드 OFF</button>
        </div>
      </div>
    </div>
  </div>

function showStageBanner(stage){
  currentStage=stage;
  currentThemeId=themeForStage(stage).id;
  stageBanner={t:2.15,maxT:2.15,stage};
}
function resetStageThemes(){
  stageThemeIds={};
  stageThemeBag=[];
  currentThemeId="office";
}
function shuffledThemeBag(){
  const ids=Object.keys(stageThemes);
  for(let i=ids.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [ids[i],ids[j]]=[ids[j],ids[i]];
  }
  return ids;
}
function themeForStage(stage=currentStage){
  stage=Math.max(1,stage||1);
  if(!stageThemeIds[stage]){
    if(!stageThemeBag.length)stageThemeBag=shuffledThemeBag();
    stageThemeIds[stage]=stageThemeBag.shift();
  }
  return stageThemes[stageThemeIds[stage]]||stageThemes.office;
}
function activeTheme(){return themeForStage(currentStage)}
function waveForStage(stage=currentStage){
  if(stage<=1)return wave1;
  if(stage===2)return wave2;
  return wave3;
}
function stageAge(){
  if(currentStage===2)return Math.max(0,elapsed-stage2Start);
  if(currentStage>=3)return Math.max(0,elapsed-stage3Start);
  return elapsed;
}
function approach(v,target,step){
  return v<target?Math.min(target,v+step):Math.max(target,v-step);
}

function playTone(freq,duration,type="sine",gain=.12,when=0,slide=0){

  const t=audioCtx.currentTime+when;
  const osc=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(freq,t);
  if(slide)osc.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+duration);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(gain,t+.012);
  g.gain.exponentialRampToValueAtTime(.001,t+duration);
  osc.connect(g);g.connect(masterGain);

}
function playNoise(duration,gain=.08,when=0,filterFreq=900){

  const filter=audioCtx.createBiquadFilter();

}
function playSweep(start,end,duration,gain=.08,when=0,q=8){

function loop(now){
  const dt=Math.min((now-last)/1000,.033);last=now;
  if(!paused){update(dt);draw()}
  requestAnimationFrame(loop);
}

function update(dt){
  elapsed+=dt;player.frame+=dt*6.5;shake=Math.max(0,shake-dt*18);player.inv=Math.max(0,player.inv-dt);player.slowT=Math.max(0,(player.slowT||0)-dt);
  updatePose(dt);
  updateStageClear(dt);
  updateBossVsCutscene(dt);
  updateUltimate(dt);
  updateWaveState(dt);
  if(stageClearMode){
    shots.length=0;
    bossShots.length=0;
    floaters.length=0;
    updateEffects(dt);
  }else if(bossVsCutscene.active){
    player.moving=false;
    player.vx=0;
    player.vy=0;
    shots.length=0;
    bossShots.length=0;
    updateEffects(dt);
  }else{
    movePlayer(dt);spawn(dt);updateEnemies(dt);updateBossShots(dt);updateSkills(dt);updateShots(dt);updateEffects(dt);collectGems();
  }
  hpFill.style.width=clamp(player.hp/player.maxHp*100,0,100)+"%";
  xpFill.style.width=clamp(player.xp/player.next*100,0,100)+"%";
  spFill.style.width=clamp(player.sp/player.maxSp*100,0,100)+"%";
  levelText.textContent=`Lv. ${player.level} 분석가`;
  killText.textContent=`처리 ${kills}`;
  const m=Math.floor(elapsed/60),s=Math.floor(elapsed%60);timeText.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  renderSkillHud();
  if(player.hp<=0&&!gameOver){gameOver=true;paused=true;openEnd()}
}

function updateStageClear(dt){
  if(stageClearBanner.t>0)stageClearBanner.t=Math.max(0,stageClearBanner.t-dt);
  if(stageBanner.t>0)stageBanner.t=Math.max(0,stageBanner.t-dt);
  const theme=activeTheme();
  outdoorBlend=approach(outdoorBlend,theme.outdoor,dt*OUTDOOR_BLEND_SPEED);
  factoryBlend=approach(factoryBlend,theme.factory,dt*OUTDOOR_BLEND_SPEED);
  if(stageClearMode&&stageClearTimer>0){
    stageClearTimer=Math.max(0,stageClearTimer-dt);
    if(stageClearTimer<=0)finishBossClear();
  }
}

function finishBossClear(){
  stageClearMode=false;
  const nextStage=Math.min(3,(currentStage||1)+1);
  showStageBanner(nextStage);
  postBossPower=nextStage>=2?1:0;
  if(nextStage===2){
    stage2Start=elapsed;
    wave2.started=false;
    wave2.active=false;
    wave2.done=false;
    wave2.start=0;
    wave2.banner=0;
  }else if(nextStage===3){
    stage3Start=elapsed;
    wave2.active=false;
    wave2.done=true;
    wave3.started=false;
    wave3.active=false;
    wave3.done=false;
    wave3.start=0;
    wave3.banner=0;
  }
  spawnTimer=0;
  player.inv=Math.max(player.inv,.8);
  if(arenaFence){
    arenaFence.t=Math.min(arenaFence.t,1);
    arenaFence.clearing=true;
  }
  show(`${nextStage} STAGE: ${activeTheme().name} 진입`);
}

function pickStageBossId(stage=currentStage){
  return themeForStage(stage).bossId;
}
function beginBossVsCutscene(stage=currentStage,bossId=null){
  if(typeof stage==="string"){bossId=stage;stage=currentStage}
  stage=Math.max(1,stage||currentStage||1);
  bossId=bossId||pickStageBossId(stage);
  if(bossVsCutscene.active||bossStageSpawned[stage]||enemies.some(e=>e.boss))return;
  bossVsCutscene={active:true,t:2.45,maxT:2.45,bossId,stage};
  shots.length=0;
  bossShots.length=0;
  player.moving=false;
  player.vx=0;
  player.vy=0;
  player.dir="side";
  player.face=1;
}

function updateBossVsCutscene(dt){
  if(!bossVsCutscene.active)return;
  bossVsCutscene.t=Math.max(0,bossVsCutscene.t-dt);
  if(bossVsCutscene.t<=0){
    bossVsCutscene.active=false;
    if(bossVsCutscene.bossId==="cultFanatic")spawnBoss3(bossVsCutscene.stage);
    else if(bossVsCutscene.bossId==="cheonSangmu")spawnBoss2(bossVsCutscene.stage);
    else spawnBoss1(bossVsCutscene.stage);
  }
}

function movePlayer(dt){
  let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
  let y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  if(player.ultimateTimer>0){player.moving=false;player.vx=0;player.vy=0;return}
  if(player.action==="clear"&&player.actionTimer>0){player.moving=false;player.vx=0;player.vy=0;return}
  if(player.action&&player.actionTimer>0&&!(x||y)){player.moving=false;player.vx=0;player.vy=0;return}
  if((x||y)&&player.action){player.action=null;player.actionTimer=0}
  player.moving=!!(x||y);
  player.vx=0;player.vy=0;
  if(x||y){
    const l=Math.hypot(x,y);x/=l;y/=l;
    player.vx=x;player.vy=y;
    if(Math.abs(x)>Math.abs(y)){player.dir="side";player.face=x>0?1:-1}
    else{player.dir=y>0?"down":"up"}
  }
  const coffee=active("coffee").level;
  const slowMul=player.slowT>0?.46:1;
  player.x=clamp(player.x+x*(player.speed+coffee*18)*slowMul*dt,20,world.w-20);
  player.y=clamp(player.y+y*(player.speed+coffee*18)*slowMul*dt,20,world.h-20);
  if(arenaFence){
    player.x=clamp(player.x,arenaFence.x+28,arenaFence.x+arenaFence.w-28);
    player.y=clamp(player.y,arenaFence.y+28,arenaFence.y+arenaFence.h-28);
  }
}

function triggerPose(action,duration){
  player.action=action;
  player.actionTimer=duration;
  player.actionDuration=duration;
}

function updatePose(dt){
  if(!player.action)return;
  player.actionTimer-=dt;
  if(player.actionTimer<=0){
    player.action=null;

      arenaFence.t-=dt*2.2;

  if(pendingBossVs&&arenaFence&&arenaFence.t>=1.1){

    spawnTimer=9999;

    pendingBossVs=true;

    wave2.start=elapsed;

    show(`${currentStage} WAVE: ${activeTheme().name} 러시`);

  if(wave2.active&&elapsed-wave2.start>=wave2.duration){
    wave2.active=false;

    spawnTimer=9999;
    createArenaFence();
    pendingBossVs=true;

  }
  if(currentStage>=3&&!wave3.started&&!wave3.done&&stage3Start>0&&elapsed-stage3Start>=wave3.triggerAt){

function pointInFence(x,y,f,pad=0){
  return !!f&&x>f.x+pad&&x<f.x+f.w-pad&&y>f.y+pad&&y<f.y+f.h-pad;
}

function directionVector(){
  if(player.dir==="up")return {x:0,y:-1};
  if(player.dir==="down")return {x:0,y:1};
  return {x:player.face<0?-1:1,y:0};
}

function rowFromVector(d){
  if(Math.abs(d.x)>Math.abs(d.y))return d.x<0?1:2;
  return d.y<0?3:0;
}

function rowFromAngle4(a){
  const x=Math.cos(a),y=Math.sin(a);
  if(Math.abs(x)>=Math.abs(y))return x<0?2:1;
  return y>0?0:3;
}

function spawn(dt){
  const wave=waveForStage(currentStage);
  if(wave.done)return;
  spawnTimer-=dt;
  if(spawnTimer>0)return;
  const age=stageAge();
  const stageScale=1+(currentStage-1)*.42;
  const pressure=(1+age/90)*stageScale;
  const theme=activeTheme();
  const female=enemyTypes.find(e=>e.id==="cryingFemale");
  const male=enemyTypes.find(e=>e.id==="cryingMale");
  const roadCyclist=enemyTypes.find(e=>e.id==="roadCyclist");
  const fixieShooter=enemyTypes.find(e=>e.id==="fixieShooter");
  const fishermanUncle=enemyTypes.find(e=>e.id==="fishermanUncle");
  const lazyFactoryWorker=enemyTypes.find(e=>e.id==="lazyFactoryWorker");
  const tapeThrower=enemyTypes.find(e=>e.id==="tapeThrower");
  const juCousinWorker=enemyTypes.find(e=>e.id==="juCousinWorker");
  if(theme.id==="office"){
    const waveProgress=wave.active?clamp((elapsed-wave.start)/wave.duration,0,1):0;
    const waveSpeed=1.32+waveProgress*.18;
    const officeRush=wave.active;
    spawnTimer=officeRush?Math.max(.34,.72-pressure*.035):Math.max(.5,.95-pressure*.03);
    const type=age>=wave1.maleAt&&Math.random()<(.34+currentStage*.04)?male:female;
    const count=officeRush?4:(Math.random()<.14+currentStage*.06?2:1);
    for(let i=0;i<count;i++)spawnEnemy(type,Math.floor(Math.random()*4),pressure*(officeRush?1.08:1),officeRush?waveSpeed:1+currentStage*.04);
    return;
  }
  if(theme.id==="factory"){
    const stage3Pressure=Math.max(1.25,pressure*.64);
    const waveRush=wave.active;
    spawnTimer=waveRush?Math.max(.24,.58-pressure*.03):Math.max(.34,.78-pressure*.028);
    const roll=Math.random();
    const type=waveRush
      ?(roll<.48?lazyFactoryWorker:roll<.76?tapeThrower:juCousinWorker)
      :(roll<.55?lazyFactoryWorker:roll<.82?tapeThrower:juCousinWorker);
    const count=type&&type.ranged?1:(Math.random()<(waveRush?.34:.18)?2:1);
    for(let i=0;i<count;i++)spawnEnemy(type,Math.floor(Math.random()*4),stage3Pressure*(waveRush?1.08:1),type===lazyFactoryWorker?1.06:1);
    return;
  }
  if(theme.id==="bike"){
    const fishermanUnlocked=age>=wave2.fishermanAt;
    const stage2Pressure=Math.max(1,pressure*.52);
    const waveRush=wave.active;
    spawnTimer=waveRush?Math.max(.26,.62-pressure*.035):Math.max(.42,.9-pressure*.03);
    const roll=Math.random();
    const type=waveRush
      ?(roll<.64?roadCyclist:roll<.84?fixieShooter:fishermanUncle)
      :(fishermanUnlocked
        ?(roll<.66?roadCyclist:roll<.88?fixieShooter:fishermanUncle)
        :(roll<.78?roadCyclist:fixieShooter));
    const count=type&&type.ranged?1:(Math.random()<(waveRush?.28:.1)?2:1);
    for(let i=0;i<count;i++)spawnEnemy(type,Math.floor(Math.random()*4),stage2Pressure,type===roadCyclist?1.08:1);
    return;
  }
}

  p.x=clamp(p.x,20,world.w-20);p.y=clamp(p.y,20,world.h-20);

}

function spawnEnemyAt(type,x,y,pressure=1,speedScale=1,extra={}){

function updateEnemies(dt){
  const meet=active("meeting");
  for(const e of enemies){
    if(e.boss){updateBoss(e,dt);continue}
    e.hit=Math.max(0,e.hit-dt);e.slow=Math.max(0,e.slow-dt);e.inv=Math.max(0,(e.inv||0)-dt);
    if(e.object){
      if(e.id==="cultTotem"){
        e.spawnT=(e.spawnT||1)-dt;
        if(e.spawnT<=0){
          e.spawnT=1.35;
          const type=enemyTypes.find(t=>t.id==="cultMinion");
          if(type)spawnEnemyAt(type,e.x+rnd(-34,34),e.y+rnd(-34,34),1.15,1,{insideArena:true});
          effects.push({kind:"cultHeal",x:e.x,y:e.y,t:.25,maxT:.25,r:44,color:"#b56cff"});
        }
      }
      continue;
    }
    e.attackT=Math.max(0,(e.attackT||0)-dt);
    if(e.ranged)e.shootT=(e.shootT||0)-dt;
    const a=angle(e,player),slow=e.slow>0?.38:1,d=dist(e,player);
    if(e.ranged){
      const minRange=e.range*.58;
      const holdRange=e.range*.9;
      if(d>holdRange){
        e.x+=Math.cos(a)*e.spd*slow*dt;
        e.y+=Math.sin(a)*e.spd*slow*dt;
      }else if(d<minRange){
        e.x-=Math.cos(a)*e.spd*.72*slow*dt;
        e.y-=Math.sin(a)*e.spd*.72*slow*dt;
      }
      if(e.shootT<=0&&d<e.range*1.12){
        fireEnemyAttack(e,a);
        e.shootT=e.shootCd*rnd(.9,1.22);
        e.attackT=.5;
      }
    }else{
      e.x+=Math.cos(a)*e.spd*slow*dt;e.y+=Math.sin(a)*e.spd*slow*dt;
    }
    if(arenaFence&&e.insideArena){
      e.x=clamp(e.x,arenaFence.x+e.r,arenaFence.x+arenaFence.w-e.r);
      e.y=clamp(e.y,arenaFence.y+e.r,arenaFence.y+arenaFence.h-e.r);
    }else if(arenaFence&&pointInFence(e.x,e.y,arenaFence,e.r)){
      const left=Math.abs(e.x-(arenaFence.x-e.r));
      const right=Math.abs(e.x-(arenaFence.x+arenaFence.w+e.r));
      const top=Math.abs(e.y-(arenaFence.y-e.r));
      const bottom=Math.abs(e.y-(arenaFence.y+arenaFence.h+e.r));
      const m=Math.min(left,right,top,bottom);
      if(m===left)e.x=arenaFence.x-e.r;
      else if(m===right)e.x=arenaFence.x+arenaFence.w+e.r;
      else if(m===top)e.y=arenaFence.y-e.r;
      else e.y=arenaFence.y+arenaFence.h+e.r;
      e.slow=Math.max(e.slow,.2);
    }
    if(meet.level&&dist(e,player)<92+meet.level*18){e.slow=Math.max(e.slow,.12)}
    if(dist(e,player)<e.r+player.r&&player.inv<=0){
      player.hp-=e.dmg;player.inv=.75;shake=8;floaters.push({x:player.x,y:player.y-30,t:.7,text:"계획 수정",color:"#ff6b78"});
    }
  }
}

function updateBoss(b,dt){
  if(b.id==="cultFanatic"){updateCultFanatic(b,dt);return}
  if(b.id==="cheonSangmu"){updateCheonSangmu(b,dt);return}
  b.hit=Math.max(0,b.hit-dt);b.slow=Math.max(0,b.slow-dt);b.inv=Math.max(0,(b.inv||0)-dt);
  const a=angle(b,player);
  if(b.state!=="nagCast"&&b.state!=="kickCast"&&b.state!=="kickDash")b.dir={x:Math.cos(a),y:Math.sin(a)};
  if(b.stateT>0)b.stateT-=dt;
  if(b.state==="intro"){
    if(b.stateT<=0){b.state="idle";b.patternCd=1.8;b.attackCd=.8}
    return;
  }
  if(b.state==="nagCast"||b.state==="kickCast"){
    if(b.stateT<=0){
      if(b.state==="nagCast")fireBossNag(b);
      else startBossKickDash(b);
    }
    return;
  }
  if(b.state==="kickDash"){
    b.x=clamp(b.x+b.dashDx*b.dashSpeed*dt,20,world.w-20);
    b.y=clamp(b.y+b.dashDy*b.dashSpeed*dt,20,world.h-20);
    if(arenaFence){
      b.x=clamp(b.x,arenaFence.x+b.r,arenaFence.x+arenaFence.w-b.r);
      b.y=clamp(b.y,arenaFence.y+b.r,arenaFence.y+arenaFence.h-b.r);
    }
    if(!b.kickHit&&(dist(b,player)<b.r+player.r+12||pointInRotRect(player.x,player.y,b.dashStartX,b.dashStartY,b.dashAngle,BOSS_KICK_SKILL.len,BOSS_KICK_SKILL.wide+8))&&player.inv<=0){

    }

  }
  if(b.state==="coffin"){
    b.hp=Math.min(b.maxHp,b.hp+b.maxHp*CULT_SKILL.coffinHeal*dt);

    }
    return;
  }
  if(!b.coffinUsed&&b.hp/b.maxHp<=.2){
    beginCultCoffin(b);
    return;
  }
  const a=angle(b,player);
  b.dir={x:Math.cos(a),y:Math.sin(a)};
  const slow=b.slow>0?.38:1,keep=dist(b,player);
  if(keep>230&&keep<900){b.x+=Math.cos(a)*b.spd*slow*dt;b.y+=Math.sin(a)*b.spd*slow*dt}

function pointInCone(px,py,x,y,a,range,arc){
  const dx=px-x,dy=py-y,d=Math.hypot(dx,dy);
  if(d>range)return false;
  let da=Math.atan2(dy,dx)-a;
  while(da>Math.PI)da-=Math.PI*2;
  while(da<-Math.PI)da+=Math.PI*2;
  return Math.abs(da)<=arc/2;
}

function pointInRotRect(px,py,x,y,a,len,wide){
  const dx=px-x,dy=py-y,ca=Math.cos(-a),sa=Math.sin(-a);
  const rx=dx*ca-dy*sa,ry=dx*sa+dy*ca;
  return rx>0&&rx<len&&Math.abs(ry)<wide/2;
}

  for(let i=0;i<dirs.length;i++){
    const dir=dirs[i];
    shots.push({
      kind:"golf",x:player.x,y:player.y-8,
      vx:Math.cos(dir)*speed,vy:Math.sin(dir)*speed,
      r:14,age:0,life:2.8+s.level*.15,range,speed,hold,holdAge:0,
      endX:player.x+Math.cos(dir)*range,endY:player.y-8+Math.sin(dir)*range,
      dirX:Math.cos(dir),dirY:Math.sin(dir),
      phase:"out",orbitSeed:elapsed+i*.7,dmg,pierce:99,
      color:"#d7e0e8",hit:new Map()
    });
  }
}

function firePaper(){
  const s=active("paper");if(!s.level||s.t>0)return;s.t=Math.max(.55,s.cd-s.level*.18);
  const n=s.level>=5?12:3+s.level;
  for(let i=0;i<n;i++){const a=Math.PI*2*i/n+elapsed;shots.push({kind:"paper",x:player.x,y:player.y,vx:Math.cos(a)*360,vy:Math.sin(a)*360,r:9,life:1.7,dmg:8+s.level*5,pierce:s.level>=5?3:1,color:"#f6f0dc"})}
  if(s.level>=5)show("문서 분쇄 마스터");
}

function fireCalendar(){
  const s=active("calendar");if(!s.level||s.t>0)return;s.t=Math.max(1.1,s.cd-s.level*.22);
  const n=s.level>=5?5:1+Math.floor(s.level/2);
  for(let i=0;i<n;i++){const e=nearest(760),a=e?angle(player,e)+rnd(-.4,.4):rnd(0,Math.PI*2);effects.push({kind:"zone",x:player.x+Math.cos(a)*rnd(120,260),y:player.y+Math.sin(a)*rnd(120,260),r:44+s.level*8,t:.95,boom:false,dmg:24+s.level*12,color:"#ffd36b"})}
}

function fireMeeting(){
  const s=active("meeting");if(!s.level||s.t>0)return;s.t=Math.max(2.2,s.cd-s.level*.34);
  const r=s.level>=5?260:130+s.level*18;
  effects.push({kind:"pulse",x:player.x,y:player.y,r,t:.6,dmg:s.level>=5?26:8,color:"#8fd0ff"});
  for(const e of enemies)if(dist(e,player)<r){e.slow=s.level>=5?1.9:.8;e.hp-=s.level>=5?26:8;e.hit=.15}
  if(s.level>=5)show("침묵 회의 마스터");
}

function fireCoffee(){
  const s=active("coffee");if(s.level<5||s.t>0)return;s.t=s.cd;
  effects.push({kind:"pulse",x:player.x,y:player.y,r:180,t:.45,dmg:34,color:"#ffb86b"});
  for(const e of enemies)if(dist(e,player)<180){e.hp-=34;e.hit=.2}
}

function orbitCharts(dt){
  const s=active("chart");if(!s.level)return;
  const n=s.level>=5?5:1+s.level,rad=54+s.level*5;
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    for(let j=0;j<n;j++){
      const ox=player.x+Math.cos(elapsed*2.2+j*Math.PI*2/n)*rad;
      const oy=player.y+Math.sin(elapsed*2.2+j*Math.PI*2/n)*rad;
      if(Math.hypot(e.x-ox,e.y-oy)<e.r+10&&e.hit<=0){
        e.hp-=s.level>=5?24:10+s.level*3;e.hit=.28;
        if(s.level>=5)shots.push({kind:"chart",x:ox,y:oy,vx:(e.x-player.x)*2.4,vy:(e.y-player.y)*2.4,r:7,life:.5,dmg:12,pierce:1,color:"#9ff0c5"});
      }
    }
  }
}

function updateShots(dt){
  for(let i=shots.length-1;i>=0;i--){
    const p=shots[i];p.life-=dt;
    if(p.kind==="golf"){
      p.age+=dt;
      if(p.phase==="out"){
        const step=p.speed*dt,d=Math.hypot(p.endX-p.x,p.endY-p.y);
        if(d<=step){
          p.x=p.endX;p.y=p.endY;p.phase="hold";p.hit=new Map();
          playSfx("golfSpin");
        }else{
          const a=Math.atan2(p.endY-p.y,p.endX-p.x);
          p.vx=Math.cos(a)*p.speed;p.vy=Math.sin(a)*p.speed;
          p.x+=p.vx*dt;p.y+=p.vy*dt;
        }
      }else if(p.phase==="hold"){
        p.holdAge+=dt;
        p.x=p.endX;
        p.y=p.endY;
        const spin=p.holdAge*18+p.orbitSeed;
        p.vx=-Math.sin(spin)*p.speed*.2;
        p.vy=Math.cos(spin)*p.speed*.2;
        if(p.holdAge>=p.hold){p.phase="return";p.returning=true;p.hit=new Map();playSfx("golfReturn")}
      }else if(p.phase==="return"){
        const returnDist=dist(p,player);
        const speed=520+active("golf").level*60+Math.max(0,returnDist-p.range)*1.35;
        const a=angle(p,player);
        p.vx=Math.cos(a)*speed;p.vy=Math.sin(a)*speed;
        p.x+=p.vx*dt;p.y+=p.vy*dt;
        if(dist(p,player)<26)p.life=0;
      }
    }else{
      p.x+=p.vx*dt;p.y+=p.vy*dt;
    }
    for(const e of enemies){
      const lastHit=p.hit?p.hit.get(e):undefined;
      const already=p.kind==="golf"
        ?(p.phase==="hold"?lastHit!==undefined&&p.age-lastHit<.18:lastHit!==undefined)
        :false;
      const hitRadius=p.kind==="golf"&&p.phase==="hold"?42+active("golf").level*4:p.r;
      if(p.pierce>0&&!already&&(e.inv||0)<=0&&dist(p,e)<hitRadius+e.r){
        const dmg=p.kind==="golf"&&p.phase==="hold"?p.dmg*.42:p.dmg;
        e.hp-=dmg;e.hit=.14;p.pierce--;
        if(p.hit)p.hit.set(e,p.age);
        floaters.push({x:e.x,y:e.y-e.r,t:.45,text:Math.round(dmg),color:p.color});
      }
    }
    if(p.life<=0||p.pierce<=0)shots.splice(i,1);
  }
  for(let i=enemies.length-1;i>=0;i--)if(enemies[i].hp<=0)killEnemy(i);
}

function updateBossShots(dt){
  for(let i=bossShots.length-1;i>=0;i--){
    const p=bossShots[i];p.life-=dt;p.spin+=dt*9;
    if(p.delay>0){p.delay-=dt;continue}
    if(p.kind==="heatCloud"){
      const a=p.angle??Math.atan2(p.vy,p.vx);
      if(p.travel<p.ringRadius){
        if(p.travel>=p.slowAt){
          const left=clamp((p.ringRadius-p.travel)/(p.ringRadius-p.slowAt),0,1);
          p.speed=52+(CHEON_HEAT_SKILL.spd-52)*left*left;
        }
        const step=Math.min(p.speed*dt,p.ringRadius-p.travel);
        p.travel+=step;
        p.x=p.ox+Math.cos(a)*p.travel;
        p.y=p.oy+Math.sin(a)*p.travel;
        if(p.travel>=p.ringRadius){
          p.x=p.ox+Math.cos(a)*p.ringRadius;
          p.y=p.oy+Math.sin(a)*p.ringRadius;
          p.speed=0;
          p.life=Math.min(p.life,p.holdT);
        }
      }
      p.vx=Math.cos(a)*p.speed;
      p.vy=Math.sin(a)*p.speed;
    }else{
      p.x+=p.vx*dt;p.y+=p.vy*dt;
    }
    if(dist(p,player)<p.r+player.r&&player.inv<=0){
      player.hp-=p.dmg;player.inv=.65;shake=5;
      floaters.push({x:player.x,y:player.y-28,t:.6,text:p.hitText||(p.kind==="nabul"?"\uB098\uBD88\uB098\uBD88":"\uC9C1\uC778 \uB3C4\uC7A5"),color:"#ff6b78"});
      bossShots.splice(i,1);
      continue;
    }
    if(p.life<=0||p.x<0||p.y<0||p.x>world.w||p.y>world.h)bossShots.splice(i,1);
  }
}

function updateEffects(dt){
  for(let i=effects.length-1;i>=0;i--){
    const e=effects[i];e.t-=dt;
    if(e.kind==="ultimateBall"){
      e.x+=e.dx*e.speed*dt;
      e.y+=e.dy*e.speed*dt;
      for(const m of enemies){
        if(!e.hit.has(m)&&(m.inv||0)<=0&&Math.hypot(m.x-e.x,m.y-e.y)<e.r+m.r){
          e.hit.add(m);
          m.hp-=e.dmg;
          m.hit=.35;
          m.slow=1.3;
          m.ultimateHit=true;
        floaters.push({x:m.x,y:m.y-m.r,t:.55,text:"대충돌",color:"#eaf9ff"});
          shake=Math.max(shake,8);
        }
      }
    }
    if(e.kind==="zone"&&e.t<.22&&!e.boom){e.boom=true;for(const m of enemies)if((m.inv||0)<=0&&Math.hypot(m.x-e.x,m.y-e.y)<e.r){m.hp-=e.dmg;m.hit=.2;m.slow=.4}shake=4}
    if(e.kind==="enemyTapeWhip"&&!e.hit&&e.t<e.maxT*.46){
      e.hit=true;
      if(pointInRotRect(player.x,player.y,e.x+Math.cos(e.angle)*e.range*.48,e.y+Math.sin(e.angle)*e.range*.48,e.angle,e.range,e.wide)&&player.inv<=0){
        player.hp-=e.dmg;player.inv=.7;shake=7;
        floaters.push({x:player.x,y:player.y-28,t:.6,text:"테이프 채찍",color:"#ff6b78"});
      }
    }
    if(e.kind==="cultHandsZone"){
      e.damageT=Math.max(0,(e.damageT||0)-dt);
      if(dist(e,player)<e.r+player.r){
        player.slowT=Math.max(player.slowT||0,.18);
        if(e.damageT<=0){
          e.damageT=.55;
          player.hp-=2;
          shake=Math.max(shake,3);
          floaters.push({x:player.x,y:player.y-28,t:.45,text:"저주",color:"#d9b6ff"});
        }
      }
    }
    if(e.kind==="cultHandsWarn"&&e.t<=0&&!e.spawned){
      e.spawned=true;
      effects.push({kind:"cultHandsZone",x:e.x,y:e.y,r:e.r,t:5.5,maxT:5.5,frameT:0,color:"#7e58d6"});
    }
    if(e.t<=0)effects.splice(i,1);
  }
  for(let i=floaters.length-1;i>=0;i--){floaters[i].t-=dt;floaters[i].y-=34*dt;if(floaters[i].t<=0)floaters.splice(i,1)}
  for(let i=enemies.length-1;i>=0;i--)if(enemies[i].hp<=0)killEnemy(i);
}

function killEnemy(i){
  const e=enemies[i];
  if(e.boss){
    kills++;
    beginBossClear(e);
    for(let j=0;j<10;j++)gems.push({x:e.x+rnd(-46,46),y:e.y+rnd(-30,40),r:6,value:4});
    const bossDownText=e.id==="cultFanatic"?"광신도 퇴장":e.id==="cheonSangmu"?"천상무 퇴장":"주대리 퇴장";
    floaters.push({x:e.x,y:e.y-88,t:1.1,text:bossDownText,color:"#fff8d6"});
    enemies.splice(i,1);shake=16;return;
  }
  if(e.object){
    effects.push({kind:"pop",x:e.x,y:e.y,r:e.r+18,t:.35,color:e.id==="cultCoffin"?"#b56cff":"#d7b15f"});
    enemies.splice(i,1);
    shake=Math.max(shake,7);
    return;
  }
  const gemGold=e.gem==="gold";
  kills++;gems.push({x:e.x,y:e.y,r:gemGold?8:6,value:e.xp,kind:gemGold?"gold":"blue"});effects.push({kind:"pop",x:e.x,y:e.y,r:e.r,t:.35,color:gemGold?"#ffd45a":"#dfe7ef"});enemies.splice(i,1);
  const spGain=e.ultimateHit?.35+e.xp*.08:2+e.xp*.35;
  gainSp(spGain);
}

function collectGems(){
  for(let i=gems.length-1;i>=0;i--){
    const g=gems[i],d=dist(g,player);
    if(d<player.r+g.r){player.xp+=g.value;gems.splice(i,1);if(player.xp>=player.next)levelUp()}
  }
}

function levelUp(){
  player.xp-=player.next;player.level++;player.next=Math.floor(player.next*1.28+8);paused=true;
  const available=skills.filter(s=>s.level<s.max);
  const picks=[];
  while(picks.length<3&&available.length){const s=available.splice(Math.floor(Math.random()*available.length),1)[0];picks.push(s)}
  levelChoices=picks;
  selectedChoice=0;
  choicesEl.innerHTML=picks.map((s,i)=>`<button class="choice" data-index="${i}" data-id="${s.id}"><b>${s.icon}</b><strong>${s.name} ${s.level?`Lv.${s.level+1}`:"NEW"}</strong><p>${s.desc}${s.level+1===s.max?" 마스터하면 필살기로 진화합니다.":""}</p></button>`).join("");
  updateChoiceSelection();
  levelOverlay.classList.remove("hidden");
}

choicesEl.onclick=e=>{
  const btn=e.target.closest(".choice");if(!btn)return;
  selectedChoice=Number(btn.dataset.index)||0;
  confirmLevelChoice();
};

function moveLevelSelection(delta){
  if(!levelChoices.length)return;
  selectedChoice=(selectedChoice+delta+levelChoices.length)%levelChoices.length;
  updateChoiceSelection();
}

function updateChoiceSelection(){
  Array.from(choicesEl.querySelectorAll(".choice")).forEach((btn,i)=>btn.classList.toggle("selected",i===selectedChoice));
}

function confirmLevelChoice(){
  const s=levelChoices[selectedChoice];
  if(!s)return;
  s.level++;
  if(s.level===s.max)show(`${s.name} 마스터. 필살기 개방.`);
  levelChoices=[];
  levelOverlay.classList.add("hidden");paused=false;last=performance.now();
}

function renderSkillHud(){
  skillHud.innerHTML=skills.filter(s=>s.level>0).map(s=>`<div class="slot"><b>${s.icon}</b><span>${s.name}</span><small>Lv.${s.level}${s.level>=s.max?" MAX":""}</small></div>`).join("");
}

function openEnd(){
  stopGameBgm();
  startOverlay.classList.remove("hidden");
  const characterSelect=startOverlay.querySelector(".character-select");
  if(characterSelect)characterSelect.classList.add("hidden");
  startOverlay.querySelector("h1").textContent="게임 실패";
  startOverlay.querySelector("h1").classList.remove("select-title");
  let lead=startOverlay.querySelector(".lead");
  if(!lead){
    lead=document.createElement("p");
    lead.className="lead";
    startOverlay.querySelector(".card").insertBefore(lead,startOverlay.querySelector(".start-row"));
  }
  lead.textContent=`${Math.floor(elapsed)}초 동안 버티고 ${kills}건의 업무 방해를 처리했습니다. 스페이스바로 다시 시작하세요.`;
  document.getElementById("startBtn").textContent="다시 시작";
  document.getElementById("startBtn").classList.remove("press-space");
  document.getElementById("startBtn").classList.add("end-retry");
  document.getElementById("startBtn").onclick=restart;
}

function draw(){
  const c=cam();ctx.save();
  if(shake)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  drawBg(c);ctx.translate(-c.x,-c.y);
  drawArenaFence();
  for(const g of gems)drawGem(g);
  for(const e of effects)drawEffect(e);
  for(const p of shots)drawShot(p);
  for(const p of bossShots)if(!p.delay||p.delay<=0)drawBossShot(p);
  for(const e of enemies)drawEnemy(e);
  drawPlayer();
  drawUltimateQuote();
  for(const f of floaters)drawText(f);
  ctx.restore();
  drawWaveOverlay();
  drawStageOverlay();
  drawBossVsCutsceneV2();
  drawStageClearBanner();
}

function drawBg(c){
  ctx.fillStyle="#dce5e8";ctx.fillRect(0,0,W,H);
  if(bgTile.complete&&bgTile.naturalWidth){
    const tile=512;
    const cx=Math.floor(c.x),cy=Math.floor(c.y);
    const ox=-(cx%tile),oy=-(cy%tile);
    ctx.imageSmoothingEnabled=false;
    for(let x=ox-tile;x<W+tile;x+=tile){
      for(let y=oy-tile;y<H+tile;y+=tile){
        ctx.drawImage(bgTile,x,y,tile,tile);
      }
    }
  }else{
    const grd=ctx.createLinearGradient(0,0,0,H);grd.addColorStop(0,"#e7edf0");grd.addColorStop(1,"#ccd9de");ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
  }
  if(outdoorBlend>0&&bikeRoadTile.complete&&bikeRoadTile.naturalWidth){
    ctx.save();
    ctx.globalAlpha=clamp(outdoorBlend,0,1);
    const tile=512;
    const cx=Math.floor(c.x),cy=Math.floor(c.y);
    const ox=-(cx%tile),oy=-(cy%tile);
    ctx.imageSmoothingEnabled=false;
    for(let x=ox-tile;x<W+tile;x+=tile){
      for(let y=oy-tile;y<H+tile;y+=tile){
        ctx.drawImage(bikeRoadTile,x,y,tile,tile);
      }
    }
    ctx.restore();
  }
  if(factoryBlend>0&&factoryTapeTile.complete&&factoryTapeTile.naturalWidth){
    ctx.save();
    ctx.globalAlpha=clamp(factoryBlend,0,1);
    const tile=512;
    const cx=Math.floor(c.x),cy=Math.floor(c.y);
    const ox=-(cx%tile),oy=-(cy%tile);
    ctx.imageSmoothingEnabled=false;
    for(let x=ox-tile;x<W+tile;x+=tile){
      for(let y=oy-tile;y<H+tile;y+=tile){
        ctx.drawImage(factoryTapeTile,x,y,tile,tile);
      }
    }
    ctx.restore();
  }
  ctx.fillStyle="rgba(58,151,178,.07)";
  for(let i=0;i<7;i++){
    const x=Math.round(((i*431-Math.floor(c.x)*.18)%W+W)%W);
    const y=Math.round(((i*227-Math.floor(c.y)*.18)%H+H)%H);
    ctx.fillRect(x,y,130,16);ctx.fillRect(x+18,y+16,74,7);
  }
  const glow=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.12,W/2,H/2,Math.max(W,H)*.72);
  glow.addColorStop(0,"rgba(255,255,255,.16)");
  glow.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
}

function drawArenaFence(){
  if(!arenaFence)return;
  const f=arenaFence,pulse=Math.sin((f.t||0)*5)*.08+.92;
  ctx.save();
  ctx.globalAlpha=clamp((f.t||0)*1.8,0,1);
  ctx.strokeStyle="#2b3948";
  ctx.lineWidth=8;
  ctx.strokeRect(f.x,f.y,f.w,f.h);
  ctx.strokeStyle="#f1d37a";
  ctx.lineWidth=3;
  ctx.setLineDash([18,12]);
  ctx.lineDashOffset=-(f.t||0)*36;
  ctx.strokeRect(f.x+7,f.y+7,f.w-14,f.h-14);
  ctx.setLineDash([]);
  ctx.fillStyle="#263242";
  for(let x=f.x;x<=f.x+f.w;x+=72){
    ctx.fillRect(x-5,f.y-12,10,28);
    ctx.fillRect(x-5,f.y+f.h-16,10,28);
  }
  for(let y=f.y;y<=f.y+f.h;y+=72){
    ctx.fillRect(f.x-12,y-5,28,10);
    ctx.fillRect(f.x+f.w-16,y-5,28,10);
  }
  ctx.globalAlpha=.18*pulse;
  ctx.fillStyle="#ffe08a";
  ctx.fillRect(f.x+10,f.y+10,f.w-20,f.h-20);
  ctx.restore();
}

function drawWaveOverlay(){
  const t=Math.max(wave1.banner,wave2.banner,wave3.banner);
  if(t<=0)return;
  const progress=1-t/2.4;
  const alpha=progress<.18?progress/.18:t<.45?t/.45:1;
  const scale=progress<.22?.72+progress*1.45:1+Math.sin(progress*Math.PI)*.06;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.fillStyle=`rgba(11,18,28,${.34*alpha})`;
  ctx.fillRect(0,0,W,H);
  if(waveBanner.complete&&waveBanner.naturalWidth){
    const w=Math.min(W*.82,620)*scale;
    const h=w*(waveBanner.naturalHeight/waveBanner.naturalWidth);
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(waveBanner,W/2-w/2,H/2-h/2,w,h);
  }else{
    ctx.fillStyle="#f5fbff";
    ctx.font=`${Math.floor(72*scale)}px Malgun Gothic`;
    ctx.textAlign="center";
    ctx.fillText("WAVE TIME",W/2,H/2);
  }
  ctx.restore();
}

function drawStageOverlay(){
  if(stageBanner.t<=0)return;
  const p=1-stageBanner.t/stageBanner.maxT;
  const alpha=p<.18?p/.18:stageBanner.t<.42?stageBanner.t/.42:1;
  const scale=p<.2?.78+p*1.4:1+Math.sin(p*Math.PI)*.08;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.fillStyle=`rgba(10,16,24,${.28*alpha})`;
  ctx.fillRect(0,0,W,H);
  ctx.translate(W/2,H*.36);
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.font=`900 ${Math.floor(76*scale)}px "Courier New","Lucida Console",monospace`;
  ctx.lineWidth=9;
  ctx.strokeStyle="#090c10";
  ctx.fillStyle="#fff6d0";
  const text=`${stageBanner.stage} STAGE`;
  ctx.strokeText(text,0,0);
  ctx.fillText(text,0,0);
  ctx.font=`900 ${Math.floor(18*scale)}px "Courier New","Lucida Console",monospace`;
  ctx.fillStyle="#8ce8ff";
  ctx.strokeStyle="#090c10";
  ctx.lineWidth=5;
  ctx.strokeText("SURVIVE",0,56*scale);
  ctx.fillText("SURVIVE",0,56*scale);
  ctx.restore();
}

function drawPlayer(){
  ctx.save();ctx.translate(Math.round(player.x),Math.round(player.y));
  if(player.inv>0&&player.action!=="clear"&&Math.floor(elapsed*18)%2){ctx.globalAlpha=.45}
  if(player.action==="clear"&&clearSprite.complete&&clearSprite.naturalWidth){
    const fw=Math.floor(clearSprite.naturalWidth/4),fh=clearSprite.naturalHeight;

function drawGeontaekPixel(){

  const bob=player.moving?Math.abs(walk)*2:Math.sin(player.frame*.45)*.8;
  ctx.save();
  ctx.translate(0,-bob);
  if(player.dir==="side")ctx.scale(player.face,1);

  const back=player.dir==="up",side=player.dir==="side";
  const skin="#f0c8bc",hair="#16191e",shirt="#f4f4ef",line="#101319",tie="#202631",pants="#151922",cyan="#65e8ff";

  // Legs
  ctx.fillStyle=line;
  if(side){
    ctx.fillRect(-7+step*2,18,7,17);ctx.fillRect(1-step*2,18,7,17);
    ctx.fillStyle=pants;ctx.fillRect(-6+step*2,18,5,15);ctx.fillRect(2-step*2,18,5,15);
  }else{
    ctx.fillRect(-10-step*2,17,8,18);ctx.fillRect(2+step*2,17,8,18);
    ctx.fillStyle=pants;ctx.fillRect(-9-step*2,17,6,16);ctx.fillRect(3+step*2,17,6,16);
  }
  ctx.fillStyle=line;ctx.fillRect(-10-step*2,33,8,4);ctx.fillRect(2+step*2,33,8,4);

  // Body and arms
  ctx.fillStyle=line;ctx.fillRect(-15,0,30,22);
  ctx.fillStyle=shirt;ctx.fillRect(-13,1,26,20);
  ctx.fillStyle=tie;
  if(!back){ctx.fillRect(-3,2,6,15);ctx.fillRect(-2,16,4,5)}
  ctx.fillStyle=shirt;
  if(side){
    ctx.fillRect(-17,2+step*2,6,18);ctx.fillRect(11,2-step*2,5,16);
    ctx.fillStyle=skin;ctx.fillRect(-18,18+step*2,6,5);ctx.fillRect(11,17-step*2,5,5);
  }else{
    ctx.fillRect(-20,3+step*2,6,18);ctx.fillRect(14,3-step*2,6,18);
    ctx.fillStyle=skin;ctx.fillRect(-20,20+step*2,6,5);ctx.fillRect(14,20-step*2,6,5);
  }

  // Head
  ctx.fillStyle=skin;
  if(side){
    ctx.fillRect(-12,-28,23,25);ctx.fillRect(8,-17,6,9);
    ctx.fillStyle=hair;ctx.fillRect(-13,-32,24,11);ctx.fillRect(-11,-23,7,8);ctx.fillRect(0,-24,8,6);
  }else{
    ctx.fillRect(-14,-29,28,25);
    ctx.fillStyle=skin;ctx.fillRect(-18,-18,5,8);ctx.fillRect(13,-18,5,8);
    ctx.fillStyle=hair;ctx.fillRect(-15,-34,30,12);ctx.fillRect(-14,-25,6,9);ctx.fillRect(-7,-24,6,7);ctx.fillRect(1,-24,7,7);ctx.fillRect(8,-25,6,8);

    ctx.fillStyle=line;ctx.fillRect(-10,-17,8,3);ctx.fillRect(3,-17,8,3);ctx.fillRect(-4,-7,8,2);
  }

  // Direction cue
  if(player.moving){
    ctx.strokeStyle=cyan;ctx.globalAlpha=.45;ctx.lineWidth=2;
    ctx.beginPath();
    if(player.dir==="up"){ctx.moveTo(0,-43);ctx.lineTo(0,-49)}
    else if(player.dir==="down"){ctx.moveTo(0,43);ctx.lineTo(0,49)}
    else{ctx.moveTo(24*player.face,0);ctx.lineTo(31*player.face,0)}
    ctx.stroke();ctx.globalAlpha=1;

function drawJuDaeri(e){
  let sheet=juDaeriSprite;
  if(e.state==="nagCast"&&juDaeriNagSprite.complete&&juDaeriNagSprite.naturalWidth)sheet=juDaeriNagSprite;
  if((e.state==="kickCast"||e.state==="kickDash")&&juDaeriKickSprite.complete&&juDaeriKickSprite.naturalWidth)sheet=juDaeriKickSprite;
  if(sheet.complete&&sheet.naturalWidth){
    const fw=sheet.naturalWidth/4,fh=sheet.naturalHeight/4;
    let row=rowFromVector(e.dir||{x:0,y:1});
    if(e.state==="kickCast"||e.state==="kickDash")row=e.kickRow??(e.dir.x<0?1:2);
    let col=Math.floor(elapsed*5+e.x*.01)%2;
    if(e.state==="nagCast")col=clamp(Math.floor((1-e.stateT/1.35)*4),0,3);
    else if(e.state==="kickCast")col=clamp(Math.floor((1-e.stateT/BOSS_KICK_SKILL.castT)*4),0,3);

    ctx.translate(e.x,e.y);ctx.rotate(e.angle);
    if(bossNagEffectSprite.complete&&bossNagEffectSprite.naturalWidth){
      const frames=6,fw=bossNagEffectSprite.naturalWidth/frames,fh=bossNagEffectSprite.naturalHeight;
      const frame=frames-1;
      const box=bossNagFrames[frame];
      const drawX=BOSS_NAG_SKILL.imgX;
      const drawY=BOSS_NAG_SKILL.imgY;
      ctx.globalAlpha=.9*(1-p*.25);
      ctx.imageSmoothingEnabled=false;
      ctx.drawImage(bossNagEffectSprite,fw*frame+box.x,box.y,box.w,box.h,drawX,drawY,BOSS_NAG_SKILL.imgW,BOSS_NAG_SKILL.imgH);
      ctx.restore();return;
    }
    ctx.globalAlpha=.24*(1-p)+.55;
    for(let i=0;i<9;i++){
      const x=30+i*34+p*80,y=Math.sin(i*1.7+p*8)*18;
      ctx.fillStyle=i%2?"#ff5d7a":"#fff1a8";
      ctx.fillRect(x,y-7,30+i%3*8,14);
    }
    ctx.globalAlpha=.25;
    ctx.fillStyle=e.color;
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,e.range,e.arc/-2,e.arc/2);ctx.closePath();ctx.fill();
    ctx.restore();return;
  }
  if(e.kind==="bossStampBurst"){
    const p=1-e.t/e.maxT;
    ctx.translate(e.x,e.y);ctx.rotate(e.angle);
    ctx.globalAlpha=.45*(1-p);
    ctx.strokeStyle=e.color;ctx.lineWidth=3;
    for(let i=-2;i<=2;i++){
      const a=i*(BOSS_NAG_SKILL.arc*.9/4);
      ctx.save();ctx.rotate(a);
      ctx.beginPath();ctx.moveTo(28,0);ctx.lineTo(290+p*35,0);ctx.stroke();
      ctx.restore();
    }
    ctx.restore();return;
  }
  if(e.kind==="bossKickTrail"){
    const p=1-e.t/e.maxT;
    ctx.translate(e.x,e.y);ctx.rotate(e.angle);
    ctx.globalAlpha=.5*(1-p);
    ctx.fillStyle="#fff1a8";ctx.fillRect(10,-8,260,16);
    ctx.fillStyle="#ff6b78";for(let i=0;i<7;i++)ctx.fillRect(26+i*34,-28+i%2*16,24,10);
    ctx.restore();return;
  }
  if(e.kind==="bossIntro"){
    const p=1-e.t/e.maxT;
    ctx.globalAlpha=.8*(1-p);
    ctx.strokeStyle=e.color;ctx.lineWidth=6;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r*p,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=.28*(1-p);ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.r*p*.7,0,Math.PI*2);ctx.fill();
    ctx.restore();return;
  }
  if(e.kind==="bossDeath"){
    const p=1-e.t/e.maxT;
    ctx.translate(e.x,e.y);
    for(let i=0;i<18;i++){
      const a=i*Math.PI*2/18+p*2,d=p*e.r*(.35+i%4*.18);
      ctx.fillStyle=i%2?"#ff5c78":"#fff1a8";
      ctx.globalAlpha=(1-p)*.9;
      ctx.fillRect(Math.cos(a)*d-5,Math.sin(a)*d-5,10,10);
    }
    ctx.strokeStyle=e.color;ctx.lineWidth=5;ctx.globalAlpha=.7*(1-p);
    ctx.beginPath();ctx.arc(0,0,e.r*p,0,Math.PI*2);ctx.stroke();
    ctx.restore();return;
  }
  if(e.kind==="bossFall"){
    const p=1-e.t/e.maxT;
    ctx.translate(e.x,e.y);
    const deathSprite=e.bossId==="cultFanatic"?cultFanaticDeathSprite:e.bossId==="cheonSangmu"?cheonSangmuDeathSprite:juDaeriDeathSprite;
    const drawSize=e.bossId==="cheonSangmu"?132:e.bossId==="cultFanatic"?156:116;
    if(deathSprite.complete&&deathSprite.naturalWidth){
      const fw=deathSprite.naturalWidth/4,fh=deathSprite.naturalHeight/2;
      const col=clamp(Math.floor(p*4),0,3);
      const row=e.row||0;
      const drawW=e.bossId==="cultFanatic"?drawSize*(fw/fh):drawSize;
      ctx.imageSmoothingEnabled=false;
      ctx.globalAlpha=.95;
      ctx.drawImage(deathSprite,fw*col,fh*row,fw,fh,-drawW/2,-drawSize*.68,drawW,drawSize);
      ctx.restore();return;
    }
    ctx.restore();return;
  }
  if(e.kind==="bossQuote"){
    const p=1-e.t/e.maxT,alpha=p<.18?p/.18:e.t<.18?e.t/.18:1;
    ctx.globalAlpha=alpha;ctx.translate(e.x,e.y);
    ctx.scale(.72+.12*Math.sin(p*Math.PI),.72+.12*Math.sin(p*Math.PI));
    drawComicShoutText(e.text,0,0);
    ctx.restore();return;
  }
  if(e.kind==="ultimateBall"){
    const frame=Math.floor((elapsed*18)%8);
    const angle=Math.atan2(e.dy,e.dx);
    ctx.translate(e.x,e.y);
    ctx.rotate(angle);
    if(ultimateBallSprite.complete&&ultimateBallSprite.naturalWidth){
      const fw=ultimateBallSprite.naturalWidth/8,fh=ultimateBallSprite.naturalHeight;
      ctx.imageSmoothingEnabled=false;
      ctx.globalAlpha=.95;
      ctx.drawImage(ultimateBallSprite,fw*frame,0,fw,fh,-96,-48,192,96);
    }else{
      ctx.fillStyle="#eef8ff";
      ctx.beginPath();ctx.arc(22,0,28,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle="#9ee8ff";ctx.lineWidth=6;
      for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(-18-i*10,0,22+i*7,-1.8,1.8);ctx.stroke()}
    }
    ctx.restore();
    return;
  }
  if(e.kind==="ultimate"){
    const p=e.maxT?1-e.t/e.maxT:.5;
    const pulse=Math.sin(p*Math.PI);
    const len=700,wide=60+pulse*64;
    ctx.translate(e.x,e.y);
    ctx.rotate(Math.atan2(e.dy,e.dx));
    ctx.globalAlpha=.2+.22*pulse;
    ctx.fillStyle="#f1c85b";
    for(let i=0;i<24;i++){
      const x=30+i*26;
      const h=wide*(.28+((i%4)*.09));
      ctx.fillRect(x,-h/2+i%2*4,22,h);
    }
    ctx.globalAlpha=.92;
    ctx.fillStyle="#fff7d2";
    for(let i=0;i<34;i++){
      const x=16+i*19;
      const h=i%2===0?12:7;
      ctx.fillRect(x,-h/2,17,h);
    }
    ctx.fillStyle="#aeb9c4";
    for(let i=0;i<24;i++){
      const x=38+i*25;
      const y=((i*17)%Math.max(16,Math.floor(wide)))-wide/2;
      const s=i%3===0?10:5;
      ctx.fillRect(x,y,s,s);
      if(i%4===0)ctx.fillRect(x+6,-y*.5,4,4);
    }
    ctx.globalAlpha=.82;
    ctx.strokeStyle="#ffffff";
    ctx.lineWidth=2;
    for(let i=0;i<4;i++){
      ctx.beginPath();
      ctx.moveTo(22+i*4,-wide*.24+i*5);
      ctx.lineTo(len*.9, -wide*.12+i*7);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
    ctx.save();
    ctx.rotate(pulse*.9);
    ctx.fillStyle="#111821";
    ctx.fillRect(4,-5,62,10);
    ctx.fillStyle="#dfe7ef";
    ctx.fillRect(7,-3,56,6);
    ctx.fillStyle="#8e9aa6";
    ctx.fillRect(58,-16,24,18);
    ctx.fillRect(74,-24,13,12);
    ctx.fillStyle="#fff4ba";
    ctx.fillRect(62,-12,10,4);
    ctx.restore();
  }
  if(e.kind==="zone"){ctx.strokeStyle=e.color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x,e.y,e.r*(e.boom?1.2:1),0,Math.PI*2);ctx.stroke();ctx.fillStyle=e.color;ctx.globalAlpha=.08;ctx.fill()}
  if(e.kind==="pulse"||e.kind==="pop"){ctx.strokeStyle=e.color;ctx.lineWidth=4;ctx.beginPath();ctx.arc(e.x,e.y,e.r*(1-e.t*.45),0,Math.PI*2);ctx.stroke()}
  ctx.restore();
}
function drawText(f){ctx.fillStyle=f.color;ctx.font="13px Malgun Gothic";ctx.textAlign="center";ctx.fillText(f.text,f.x,f.y)}
</script>
