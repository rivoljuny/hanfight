<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HAN-SERVIVE</title>
  <!-- Cache version: increment whenever game files change -->
  <link rel="stylesheet" href="style.css?v=20260705-4">
</head>
<body>
  <div class="app">
    <canvas id="game"></canvas>
    <div class="hud">
      <div class="status panel">
        <div class="bar"><div id="hpFill" class="fill"></div></div>
        <div class="bar sp"><div id="spFill" class="fill"></div></div>
        <div class="bar xp"><div id="xpFill" class="fill"></div></div>
        <div class="meta"><span id="levelText">Lv. 1 분석가</span><span id="killText">처리 0</span></div>
      </div>
      <div class="timer panel"><strong id="timeText">00:00</strong><span>퇴근까지 생존</span></div>
      <div class="stage-info panel"><strong id="stageHudText">1 STAGE</strong><span id="mapHudText">사무실</span></div>
      <div id="skillHud" class="skills"></div>
    </div>
    <div class="bottom-xp"><div id="bottomXpFill" class="fill"></div></div>
    <div id="toast" class="toast"></div>
    <div id="mobileControls" class="mobile-controls is-hidden" aria-hidden="true">
      <div id="mobileStick" class="mobile-stick" aria-label="이동 조이스틱">
        <div id="mobileStickKnob" class="mobile-stick-knob"></div>
      </div>
      <div class="mobile-actions">
        <button id="mobileUltimateBtn" class="mobile-action ultimate" type="button">필살기</button>
        <button id="mobilePauseBtn" class="mobile-action" type="button">일시정지</button>
      </div>
    </div>
    <div id="startOverlay" class="overlay">
      <div class="card start-card">
        <h1 class="select-title">SELECT PLAYER</h1>
        <img id="gameOverTitle" class="game-over-title hidden" src="assets/game_over_title.png" alt="GAME OVER">
        <div class="character-select">
          <div class="carousel" id="characterCarousel">
            <button class="carousel-btn prev" id="characterPrev" type="button" aria-label="이전 캐릭터">‹</button>
            <div id="characterCards"></div>
            <button class="carousel-btn next" id="characterNext" type="button" aria-label="다음 캐릭터">›</button>
          </div>
          <span class="select-hint">A/D 또는 방향키로 선택</span>
        </div>
        <div class="start-row">
          <div id="startBtn" class="press-space" role="button" tabindex="0"><span>PRESS</span><span class="space-key" aria-label="spacebar"></span><span>TO START</span></div>
        </div>
      </div>
    </div>

    <div id="levelOverlay" class="overlay hidden">
      <div class="card">
        <h2>LEVEL UP</h2>
        <div id="choices" class="choices"></div>
      </div>
    </div>
    <div id="pauseOverlay" class="overlay hidden">
      <div class="card pause-card">
        <h2>PAUSED</h2>
        <div class="pause-menu">
          <button id="resumeBtn" type="button">계속하기</button>
          <button id="homeBtn" type="button">처음으로</button>
          <button id="soundToggleBtn" type="button">소리 ON</button>
          <button id="bgmVolumeBtn" class="volume-row" type="button"><span>배경음</span><span class="volume-control"><span class="volume-arrow" data-dir="-1">‹</span><span class="volume-bars" id="bgmVolumeValue"></span><span class="volume-arrow" data-dir="1">›</span></span></button>
          <button id="sfxVolumeBtn" class="volume-row" type="button"><span>효과음</span><span class="volume-control"><span class="volume-arrow" data-dir="-1">‹</span><span class="volume-bars" id="sfxVolumeValue"></span><span class="volume-arrow" data-dir="1">›</span></span></button>
          <button id="pauseTestModeBtn" type="button">테스트 선택</button>
          <button id="pauseLevelUpBtn" type="button">스킬 레벨업</button>
          <button id="pauseInvincibleBtn" type="button">무적 OFF</button>
        </div>
      </div>
    </div>
    <div id="testSelectOverlay" class="overlay hidden">
      <div class="card test-select-card">
        <div class="test-select-head">
          <h2>TEST SELECT</h2>
          <button id="testSelectCloseBtn" type="button" aria-label="테스트 선택 닫기">×</button>
        </div>
        <div id="testSelectChoices" class="test-select-choices"></div>
      </div>
    </div>
  </div>

<script src="game.js?v=20260705-4"></script>
</body>
</html>
